[project]
name = "emergency-simualtion"
version = "0.1.0"
description = "Optimization of the Care Process in the Emergency Department of a Private Tertiary-Care Hospital"
requires-python = ">=3.10"

dependencies = [
    "sqlfluff",

]

[project.optional-dependencies]
test = [
    "pytest-cov-7.1.0",
    "pytest-9.1.1",
    "sqlfluff",
    "mypy",
    "ruff",

]

dev = [
    "mypy",
    "ruff",
    "sqlfluff",
]

[tool.sqlfluff.core]
dialect = "postgres"
large_file_skip_byte_limit = 100000

[tool.sqlfluff.rules.references.keywords]
ignore_words = "name,content,location,configuration"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "platform: Platform validation tests",
    "spark: Spark validation tests",
]

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
